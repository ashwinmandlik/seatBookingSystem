# Fly.io deployment. Secrets (never in this file):
#   fly secrets set DATABASE_URL='postgresql://…?sslmode=require' JWT_SECRET='…' ADMIN_KEY='…'
# Optional shared cache:
#   fly secrets set REDIS_ENABLED=true REDIS_URL='rediss://…'

app = "seat-reserve"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"     # matches graceful shutdown: in-flight reservations finish

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_POOL_SIZE = "20"
  HOLD_TTL_SECONDS = "300"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm: an on-sale burst must never land on a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Let the app, not the edge proxy, decide under load: requests queue on
  # virtual threads and the connection pool rather than being shed as 5xx.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 5000
    hard_limit = 20000

  # Routing follows readiness: an instance that cannot reach Postgres gets no traffic.
  [[http_service.checks]]
    grace_period = "60s"   # JVM start + Flyway migrations on a cold boot
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
