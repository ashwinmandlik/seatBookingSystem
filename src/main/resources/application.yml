spring:
  application:
    name: seat-reserve
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seatreserve}
    username: ${DATABASE_USERNAME:seatreserve}
    password: ${DATABASE_PASSWORD:seatreserve}
    hikari:
      # The pool is the backpressure valve: at most this many transactions
      # touch Postgres at once; the rest queue in-process instead of
      # overwhelming the database.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Under a burst, waiting for a connection is better than failing: a
      # request that waits succeeds or gets a clean 4xx; one that times out
      # becomes a 503.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:60000}
      # Defaults keep the pool full. On a pause-when-idle database set
      # DB_MIN_IDLE=0 and a short DB_IDLE_TIMEOUT_MS so idle connections close.
      minimum-idle: ${DB_MIN_IDLE:${DB_POOL_SIZE:20}}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
  flyway:
    enabled: true
  data:
    redis:
      # Optional shared hot-seat cache; only used when REDIS_ENABLED=true.
      url: ${REDIS_URL:redis://localhost:6379}
      # A cache that is slower than the database is useless: give up fast.
      timeout: ${REDIS_TIMEOUT:100ms}
      connect-timeout: 500ms
      repositories:
        enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # Requests run on virtual threads, so open connections are cheap; accept
    # a whole on-sale burst instead of refusing sockets at the door.
    max-connections: ${SERVER_MAX_CONNECTIONS:20000}
    accept-count: ${SERVER_ACCEPT_COUNT:2000}

seatreserve:
  # How long a hold (reserve with "hold": true) lasts before it expires and
  # the seat returns to available. Each seat stores its own deadline
  # (seats.held_until = now() + this TTL).
  hold-ttl-seconds: ${HOLD_TTL_SECONDS:300}
  # Defaults are for local development only; production sets real secrets.
  jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
  admin-key: ${ADMIN_KEY:local-admin-key}
  sweeper:
    # Every instance runs the sweeper; SKIP LOCKED splits the work safely.
    enabled: ${HOLD_SWEEPER_ENABLED:true}
    interval-ms: ${HOLD_SWEEP_INTERVAL_MS:1000}
  tomcat:
    # Per-connection socket buffers (Tomcat default 8 KB each way). Smaller
    # buffers make thousands of open, waiting connections cheap.
    socket-buffer-bytes: ${SEATRESERVE_TOMCAT_SOCKETBUFFERBYTES:8192}
  bulkhead:
    # Write requests processed at once; the rest wait in a fair queue, parked
    # before auth/parsing. Keeps a small CPU focused and health checks fast.
    max-concurrent-writes: ${BULKHEAD_MAX_CONCURRENT_WRITES:32}
  idle-aware:
    # Off by default. On a database that pauses when idle and bills for awake
    # time (e.g. Neon free), background jobs touch it only when needed.
    enabled: ${IDLE_AWARE_ENABLED:false}
    max-idle-minutes: ${IDLE_AWARE_MAX_IDLE_MINUTES:60}
  hot-seats:
    # In-memory fast-fail for contended seats. Only ever declines; the
    # database still makes every decision to sell.
    enabled: ${HOT_SEATS_ENABLED:true}
    cache-ttl-millis: ${HOT_SEATS_CACHE_TTL_MS:2000}
    # Safety cap on cached seats (~200 bytes each, ~100 MB at the default).
    max-entries: ${HOT_SEATS_MAX_ENTRIES:500000}
    shared-cache:
      # Redis L2 shared by all instances. Fails open: if Redis is down or
      # slow, requests skip it (circuit breaker) and the database decides.
      enabled: ${REDIS_ENABLED:false}
      ttl-millis: ${REDIS_CACHE_TTL_MS:5000}
      breaker-millis: ${REDIS_BREAKER_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
        # Also serve the probes on the main port as /livez and /readyz.
        add-additional-paths: true
      group:
        # Liveness: is the process healthy? Never depends on the database, or
        # a database outage would make the platform restart every instance.
        liveness:
          include: livenessState
        # Readiness: can we serve requests? Fails closed when Postgres is
        # unreachable, so the load balancer stops routing to us.
        readiness:
          include: readinessState,database
  health:
    # Replaced by DatabaseReadinessIndicator, which uses its own connection
    # instead of competing with requests for the pool.
    db:
      enabled: false
    redis:
      # Redis is an optional cache: its outage must never mark the service
      # unhealthy or unready. Only the database is a hard dependency.
      enabled: false
  metrics:
    tags:
      application: seat-reserve
    distribution:
      # Latency histograms, so p50/p95/p99 can be computed from the scrape.
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      # Readable text by default (IDE, ./gradlew dev). The Docker image sets
      # LOG_FORMAT=ecs, so containers and the live deployment log JSON (Elastic
      # Common Schema): every line carries request_id, and user_id once
      # authenticated. LOG_FORMAT=logstash gives the Logstash layout.
      console: ${LOG_FORMAT:}
