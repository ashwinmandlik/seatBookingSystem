# What a reviewer does with a clean clone, on machines that aren't the author's:
# build and test on Linux, macOS (Apple Silicon) and Windows; run the app with
# ./gradlew dev on each; run `docker compose up --build` exactly as documented
# and fire the burst at it. Every job starts from a fresh checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Any JDK 17+ is enough to start Gradle; the build provisions JDK 21 itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (real Postgres and Redis binaries, no Docker)
        shell: bash
        run: ./gradlew build
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test

  dev:
    name: ./gradlew dev (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Start app + embedded Postgres
        shell: bash
        run: |
          ./gradlew dev > dev.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fs http://localhost:8080/health/ready > /dev/null; then echo "ready after ~$((i * 3))s"; exit 0; fi
            sleep 3
          done
          echo "::error::app did not become ready"; cat dev.log; exit 1
      - name: API walkthrough (Postman collection, 42 assertions)
        shell: bash
        run: npx --yes newman run postman/SeatReserve.postman_collection.json --env-var target=local
      - name: App log
        if: always()
        shell: bash
        run: tail -n 100 dev.log

  compose:
    name: docker compose up --build + burst
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --build
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Ready (readiness checks Postgres)
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/health/ready; then echo; exit 0; fi
            sleep 3
          done
          exit 1
      - name: API walkthrough (Postman collection, 42 assertions)
        run: npx --yes newman run postman/SeatReserve.postman_collection.json --env-var target=local
      # Java 21 for the single-file burst client (burst.sh falls back to Docker without it).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Burst (hot-seat storm, retries, limit floods; all 12 checks must pass)
        run: ./burst.sh http://localhost:8080 --scale 1 --concurrency 500
      - name: Readiness fails closed when the database is down
        run: |
          docker compose stop postgres
          for i in $(seq 1 20); do
            code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready)
            if [ "$code" = "503" ]; then echo "ready -> 503 with Postgres down"; break; fi
            sleep 2
          done
          [ "$code" = "503" ] || { echo "::error::readiness returned $code with Postgres down"; exit 1; }
          live=$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://localhost:8080/health/live)
          [ "$live" = "200" ] || { echo "::error::liveness returned $live"; exit 1; }
          echo "live -> 200 (process is fine; only readiness depends on the database)"
          docker compose start postgres
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color --tail 200
