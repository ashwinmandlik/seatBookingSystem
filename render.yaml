# Render Blueprint (free plan): Render dashboard -> New -> Blueprint -> this repo.
# Database: Neon free (Postgres), same region as the service (AWS Singapore).
# You are prompted once for DATABASE_URL: paste Neon's *direct* (non-pooled)
# connection string, e.g. postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
services:
  - type: web
    name: seat-reserve
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No platform health check on purpose. Render gives each check 5 s, stops
    # routing after 15 s of failures and restarts after 60 s. On ~0.1 CPU, an
    # on-sale burst queues connections in the kernel (see SERVER_MAX_CONNECTIONS),
    # so a check can wait longer than 5 s behind buyers, and Render would
    # take a busy-but-healthy instance out of service mid-sale. Without a
    # check, Render restarts only if the process exits. /health/live and
    # /health/ready (which checks Postgres and fails closed) are still served.
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true

      # Neon free pauses when idle and bills awake time: leave it alone when idle.
      - key: IDLE_AWARE_ENABLED
        value: "true"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MIN_IDLE
        value: "0"
      - key: DB_IDLE_TIMEOUT_MS
        value: "60000"

      # Free instance: 512 MB RAM and a fraction of a CPU.
      # Heap 65%: non-heap measured at ~100 MB (metaspace, code cache, stacks).
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=65 -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      # Connections: always accept, and make waiting cheap.
      # Render restarts the instance when its proxy can't open a TCP connection
      # ("dial tcp ...:10000: i/o timeout"). Capping accepted connections at
      # 1,000 let the kernel's accept queue overflow in a long burst, and that
      # happened twice. With virtual threads every accepted connection was
      # processed at once and parked holding ~115 KB of request buffers, so
      # the cap couldn't simply be raised. Now a fixed pool of 32 platform
      # threads does the work; waiting connections stay small queued tasks,
      # so thousands can be accepted at once (measured with ~1,000 waiting:
      # 47 MB of old generation, 6 ms to open a new connection, and ~8% less
      # CPU per request than with virtual threads).
      - key: SPRING_THREADS_VIRTUAL_ENABLED
        value: "false"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "32"
      - key: SERVER_MAX_CONNECTIONS
        value: "8000"
      - key: SERVER_ACCEPT_COUNT
        value: "4000"
      # 2 KB socket buffers each way instead of 8 KB: requests and responses are a few hundred bytes.
      - key: SEATRESERVE_TOMCAT_SOCKETBUFFERBYTES
        value: "2048"
      # Hot-seat cache: the 2 s default bounds staleness *across instances*. This
      # service runs a single instance, where cancel and expiry clear entries
      # immediately, so a sold seat can stay known-taken for the whole sale. At
      # 2 s, half the live burst's "seat taken" answers fell back to the database
      # path just to relearn what the cache had forgotten.
      - key: HOT_SEATS_CACHE_TTL_MS
        value: "600000"
      # Cap the cache at ~20 MB on a 512 MB instance (a fully sold 7,886-seat show is ~1.6 MB).
      - key: HOT_SEATS_MAX_ENTRIES
        value: "100000"
      # Requests carry a ~300-byte JWT; 4 KB of headers is plenty and halves a buffer.
      - key: SERVER_MAXHTTPREQUESTHEADERSIZE
        value: "4KB"
