plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.seatreserve'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // Optional shared hot-seat cache (L2). The service is fully correct without it.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Real Postgres binaries run in-process: concurrency tests exercise the
    // actual row locks, and no Docker daemon is needed to run them.
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.15.0')
    // The library ships x86-64 binaries only; add ARM so a clean clone also
    // builds on Apple Silicon and on ARM servers (e.g. the deployment VM).
    testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8'
    testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8'
    // Real redis-server binaries for the shared-cache tests, again without Docker.
    testImplementation 'com.github.codemonstur:embedded-redis:1.4.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Produce a single, predictably-named jar for the Dockerfile.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
tasks.named('jar') {
    enabled = false
}

// Local run without Docker or a database install: ./gradlew dev (app + embedded Postgres).
tasks.register('dev', JavaExec) {
    group = 'application'
    description = 'Runs the app with a throwaway embedded Postgres 16 (no Docker needed).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.seatreserve.dev.LocalDev'
}

// Readable console logs when a person runs the app from Gradle; containers keep
// JSON (the default) for log pipelines. LOG_FORMAT=ecs ./gradlew dev shows the JSON.
['dev', 'bootRun'].each { name ->
    tasks.named(name) {
        if (!System.getenv('LOG_FORMAT')) {
            environment 'LOG_FORMAT', ''
        }
    }
}

// Just the database: ./gradlew devDb (then ./gradlew bootRun in another terminal).
tasks.register('devDb', JavaExec) {
    group = 'application'
    description = 'Runs a throwaway Postgres 16 on localhost:5432 (no Docker needed).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.seatreserve.dev.LocalPostgres'
}
