plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.seatreserve'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // Optional shared hot-seat cache (L2). The service is fully correct without it.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Real Postgres binaries run in-process: concurrency tests exercise the
    // actual row locks, and no Docker daemon is needed to run them.
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.15.0')
    // The library ships x86-64 binaries only; add ARM so a clean clone also
    // builds on Apple Silicon and on ARM servers (e.g. the deployment VM).
    testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8'
    testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8'
    // Real redis-server binaries for the shared-cache tests, again without Docker.
    testImplementation 'com.github.codemonstur:embedded-redis:1.4.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Tests log JSON like the Docker image (production) does, so StructuredLogTest checks the real format.
    // Logback configures once per JVM, so this has to be set for the whole test run, not per test class.
    environment 'LOG_FORMAT', 'ecs'
}

// Produce a single, predictably-named jar for the Dockerfile.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
tasks.named('jar') {
    enabled = false
}

// ./gradlew bootRun on a clean clone: with no DATABASE_URL set, a throwaway embedded Postgres 16 starts
// together with the app (io.seatreserve.dev.LocalDev), so nothing else needs installing. With
// DATABASE_URL set, bootRun runs the app alone against that database. The Docker image and the live
// deployment use the built jar, not bootRun, so this changes nothing there.
tasks.named('bootRun') {
    if (!System.getenv('DATABASE_URL')) {
        description = 'Runs the app with a throwaway embedded Postgres 16 (set DATABASE_URL to use your own).'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'io.seatreserve.dev.LocalDev'
    }
}

// Same as bootRun without DATABASE_URL; kept for anyone used to it.
tasks.register('dev', JavaExec) {
    group = 'application'
    description = 'Runs the app with a throwaway embedded Postgres 16 (same as bootRun without DATABASE_URL).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.seatreserve.dev.LocalDev'
}

// The burst test on the project's JDK 21 (downloaded if missing), so any JDK that runs Gradle (17+) can run it:
//   ./gradlew -q burst "--args=http://localhost:8080"
// Same program as ./burst.sh and java burst/Burst.java. Compiled into its own folder, only when this task runs.
def compileBurst = tasks.register('compileBurst', JavaCompile) {
    description = 'Compiles burst/Burst.java (a standalone file, not part of the app).'
    source = fileTree('burst') { include 'Burst.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('burst-classes')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.register('burst', JavaExec) {
    group = 'application'
    description = 'Runs the burst test: ./gradlew -q burst "--args=<BASE_URL> [options]"'
    dependsOn compileBurst
    classpath = files(compileBurst.flatMap { it.destinationDirectory })
    mainClass = 'Burst'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

// Just the database, on localhost:5432: ./gradlew devDb (e.g. to run SeatReserveApplication from an IDE).
tasks.register('devDb', JavaExec) {
    group = 'application'
    description = 'Runs a throwaway Postgres 16 on localhost:5432 (no Docker needed).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.seatreserve.dev.LocalPostgres'
}
