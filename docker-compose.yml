# Full stack, built and run exactly as deployed:  docker compose up --build
# API on http://localhost:8080  (/health/ready, /actuator/prometheus)
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Provider-style URL on purpose: the same format Neon/Fly/Render hand out.
      DATABASE_URL: postgresql://seatreserve:seatreserve@postgres:5432/seatreserve
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-compose-secret-change-me-0123456789abcdef
      ADMIN_KEY: local-admin-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g   # headroom for the JVM; the live Render instance has 512 MB

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatreserve
      POSTGRES_USER: seatreserve
      POSTGRES_PASSWORD: seatreserve
    # Not published on the host: the app reaches it on the compose network, and
    # a local Postgres already on 5432 would otherwise block `docker compose up`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatreserve -d seatreserve"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Optional shared hot-seat cache. The service stays correct if this is down.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
