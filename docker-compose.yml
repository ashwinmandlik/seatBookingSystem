services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatreserve
      POSTGRES_USER: seatreserve
      POSTGRES_PASSWORD: seatreserve
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatreserve -d seatreserve"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Optional shared hot-seat cache. The service stays correct if this is down.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
